<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Star Catcher — a tiny browser game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b1030; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: linear-gradient(180deg, #0b1030 0%, #1b2350 55%, #2c1a4d 100%);
           box-shadow: 0 0 60px rgba(90, 120, 255, .35); border-radius: 12px; }
  #hint { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center;
          color: rgba(255,255,255,.55); font-size: 13px; letter-spacing: .04em;
          pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="hint">Move with &larr; &rarr; keys, mouse or touch &mdash; catch gold stars, dodge red meteors</div>
<script>
"use strict";
// Star Catcher: a tiny browser game built from one prompt.
// Catch falling gold stars (+10, big ones +25). Dodge red meteors (-1 life).
// 60 seconds, 3 lives. Consecutive catches build a combo multiplier.

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Logical playfield (portrait). The canvas scales to fit the window.
const W = 540, H = 960;
let scale = 1;

function resize() {
  const pad = 16;
  const sw = (window.innerWidth - pad) / W;
  const sh = (window.innerHeight - pad) / H;
  scale = Math.min(sw, sh);
  canvas.style.width = Math.floor(W * scale) + "px";
  canvas.style.height = Math.floor(H * scale) + "px";
  canvas.width = W; canvas.height = H;
}
window.addEventListener("resize", resize);
resize();

// ---------- game state ----------
const state = {
  mode: "title",      // title | playing | over
  score: 0,
  lives: 3,
  timeLeft: 60,
  combo: 0,
  bestCombo: 0,
  caught: 0,
  missed: 0,
  elapsed: 0,
  shake: 0,
};

const basket = { x: W / 2, y: H - 90, w: 110, h: 26, targetX: W / 2, speed: 0 };
const items = [];      // falling stars / meteors
const particles = [];  // catch bursts
const bgStars = [];    // twinkling background stars

for (let i = 0; i < 90; i++) {
  bgStars.push({ x: Math.random() * W, y: Math.random() * H,
                 r: Math.random() * 1.8 + 0.4, p: Math.random() * Math.PI * 2,
                 s: 0.5 + Math.random() * 1.5 });
}

let spawnTimer = 0;
let lastTick = performance.now();

// ---------- input ----------
function moveTo(clientX) {
  const rect = canvas.getBoundingClientRect();
  basket.targetX = (clientX - rect.left) / rect.width * W;
}
canvas.addEventListener("pointermove", (e) => moveTo(e.clientX));
canvas.addEventListener("pointerdown", (e) => { moveTo(e.clientX); tap(); });
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" || e.key === "a") basket.targetX -= 34;
  if (e.key === "ArrowRight" || e.key === "d") basket.targetX += 34;
  if (e.key === "Enter" || e.key === " ") tap();
});

function tap() {
  if (state.mode === "title") startGame();
  else if (state.mode === "over") startGame();
}

// ---------- game flow ----------
function startGame() {
  state.mode = "playing";
  state.score = 0; state.lives = 3; state.timeLeft = 60;
  state.combo = 0; state.bestCombo = 0; state.caught = 0; state.missed = 0;
  state.elapsed = 0; state.shake = 0;
  items.length = 0; particles.length = 0;
  basket.x = W / 2; basket.targetX = W / 2;
}

function spawnItem() {
  const roll = Math.random();
  const kind = roll < 0.68 ? "star" : roll < 0.82 ? "big" : "meteor";
  items.push({
    kind,
    x: 30 + Math.random() * (W - 60),
    y: -30,
    vy: 150 + Math.random() * 130 + state.elapsed * 2.2,
    sway: Math.random() * 1.6 + 0.4,
    phase: Math.random() * Math.PI * 2,
    r: kind === "big" ? 26 : kind === "meteor" ? 22 : 18,
    rot: Math.random() * Math.PI * 2,
  });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 180;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
                     life: 0.5 + Math.random() * 0.4, color, r: 2 + Math.random() * 3 });
  }
}

// ---------- update ----------
function update(dt) {
  // basket easing toward target
  basket.x += (basket.targetX - basket.x) * Math.min(1, dt * 14);
  basket.x = Math.max(basket.w / 2, Math.min(W - basket.w / 2, basket.x));

  if (state.mode !== "playing") return;
  state.elapsed += dt;
  state.timeLeft = Math.max(0, 60 - state.elapsed);
  if (state.timeLeft <= 0) { state.mode = "over"; return; }

  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnItem(); spawnTimer = 0.55 - Math.min(0.25, state.elapsed * 0.003); }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy * dt;
    it.phase += dt * 3;
    it.x += Math.sin(it.phase) * it.sway;
    it.rot += dt * 1.5;

    const inBasket = it.y + it.r > basket.y - 6 && it.y - it.r < basket.y + basket.h &&
                     Math.abs(it.x - basket.x) < basket.w / 2 + it.r * 0.5;
    if (inBasket) {
      if (it.kind === "meteor") {
        state.lives -= 1; state.combo = 0; state.shake = 12;
        burst(it.x, it.y, "#ff5566", 22);
        if (state.lives <= 0) { state.mode = "over"; }
      } else {
        const mult = 1 + Math.min(4, Math.floor(state.combo / 5));
        const pts = (it.kind === "big" ? 25 : 10) * mult;
        state.score += pts; state.combo += 1; state.caught += 1;
        state.bestCombo = Math.max(state.bestCombo, state.combo);
        burst(it.x, it.y, it.kind === "big" ? "#ffe066" : "#ffd94d", 16);
      }
      items.splice(i, 1);
    } else if (it.y - it.r > H) {
      if (it.kind !== "meteor") { state.missed += 1; state.combo = 0; }
      items.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);
}

// ---------- drawing ----------
function drawStar(x, y, r, rot, color, glow) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = glow; ctx.shadowBlur = 18;
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 === 0 ? r : r * 0.45;
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    ctx[i === 0 ? "moveTo" : "lineTo"](Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawMeteor(x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = "#ff3355"; ctx.shadowBlur = 20;
  const g = ctx.createRadialGradient(0, 0, 2, 0, 0, r);
  g.addColorStop(0, "#ff8a5c"); g.addColorStop(0.55, "#ff3355"); g.addColorStop(1, "#a3122e");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.4); ctx.lineTo(r * 0.4, r * 0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r * 0.2, -r * 0.6); ctx.lineTo(r * 0.6, r * 0.1); ctx.stroke();
  ctx.restore();
}

function drawBasket() {
  ctx.save();
  ctx.translate(basket.x, basket.y);
  ctx.shadowColor = "#ffd94d"; ctx.shadowBlur = 16;
  const g = ctx.createLinearGradient(0, -14, 0, 14);
  g.addColorStop(0, "#ffe9a8"); g.addColorStop(0.5, "#f7b733"); g.addColorStop(1, "#e08a00");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-basket.w / 2, -12);
  ctx.lineTo(basket.w / 2, -12);
  ctx.lineTo(basket.w / 2 - 14, 12);
  ctx.lineTo(-basket.w / 2 + 14, 12);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(120,60,0,.55)"; ctx.lineWidth = 2;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(i * 28, -10); ctx.lineTo(i * 22, 10); ctx.stroke();
  }
  ctx.restore();
}

function drawHUD() {
  ctx.textBaseline = "top";
  ctx.fillStyle = "rgba(255,255,255,.95)";
  ctx.font = "bold 30px 'Segoe UI', system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("SCORE " + state.score, 20, 18);
  ctx.textAlign = "center";
  ctx.fillText(Math.ceil(state.timeLeft) + "s", W / 2, 18);
  ctx.textAlign = "right";
  ctx.fillText("♥".repeat(state.lives) + "♡".repeat(Math.max(0, 3 - state.lives)), W - 20, 18);
  if (state.combo >= 3) {
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffe066";
    ctx.font = "bold 24px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("COMBO x" + (1 + Math.min(4, Math.floor(state.combo / 5))) +
                 "  (" + state.combo + ")", W / 2, 58);
  }
}

function drawCenter(lines) {
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  let y = H / 2 - (lines.length - 1) * 34;
  for (const [text, size, color] of lines) {
    ctx.font = "bold " + size + "px 'Segoe UI', system-ui, sans-serif";
    ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 12;
    ctx.fillStyle = color;
    ctx.fillText(text, W / 2, y);
    y += 68;
  }
  ctx.shadowBlur = 0;
}

function render() {
  ctx.save();
  if (state.shake > 0) ctx.translate((Math.random() - 0.5) * state.shake,
                                      (Math.random() - 0.5) * state.shake);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#0b1030"); sky.addColorStop(0.55, "#1b2350"); sky.addColorStop(1, "#2c1a4d");
  ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, H + 40);

  const t = performance.now() / 1000;
  for (const s of bgStars) {
    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * s.s + s.p));
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // moon
  ctx.fillStyle = "#fdf6d8";
  ctx.shadowColor = "#fff7c0"; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.arc(W - 70, 90, 34, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  for (const it of items) {
    if (it.kind === "meteor") drawMeteor(it.x, it.y, it.r, it.rot);
    else drawStar(it.x, it.y, it.r, it.rot, it.kind === "big" ? "#ffe066" : "#ffd94d",
                  it.kind === "big" ? "#ffdf5e" : "#ffcf3f");
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawBasket();
  if (state.mode !== "title") drawHUD();

  if (state.mode === "title") {
    drawCenter([
      ["STAR CATCHER", 54, "#ffe066"],
      ["Catch stars. Dodge meteors.", 24, "#ffffff"],
      ["60 seconds. 3 lives.", 24, "#c9d4ff"],
      ["Tap or press Enter to play", 22, "#9fb2ff"],
    ]);
  } else if (state.mode === "over") {
    drawCenter([
      ["TIME UP!", 52, "#ffe066"],
      ["Score: " + state.score, 34, "#ffffff"],
      ["Stars caught: " + state.caught + "   Best combo: " + state.bestCombo, 22, "#c9d4ff"],
      ["Tap or press Enter to play again", 22, "#9fb2ff"],
    ]);
  }
  ctx.restore();
}

// ---------- main loop ----------
function frame(now) {
  const dt = Math.min(0.05, (now - lastTick) / 1000);
  lastTick = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
